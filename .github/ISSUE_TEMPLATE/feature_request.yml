name: Feature request
description: Suggest an enhancement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or business need does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Core / Product
        - Coverages
        - Plans
        - Actuarial
        - Legal
        - Emission flow
        - Workflow / SUDEASEG
        - Infrastructure
