# Apache — Producto Builder en http://192.168.8.120/
# Copiar y habilitar en srv001:
#   sudo cp deploy/apache-producto-builder.conf /etc/apache2/sites-available/producto-builder.conf
#   sudo a2enmod proxy proxy_http rewrite
#   sudo a2ensite producto-builder.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Requiere PM2: producto-builder-web (:5215) + producto-builder-api (:3001)

<VirtualHost *:80>
    ServerName 192.168.8.120

    # Opción A (recomendada): proxy a vite preview — maneja /emitir y demás rutas SPA
    ProxyPreserveHost On
    ProxyPass        /api/  http://127.0.0.1:3001/api/
    ProxyPassReverse /api/  http://127.0.0.1:3001/api/
    ProxyPass        /      http://127.0.0.1:5215/
    ProxyPassReverse /      http://127.0.0.1:5215/

    ErrorLog ${APACHE_LOG_DIR}/producto-builder-error.log
    CustomLog ${APACHE_LOG_DIR}/producto-builder-access.log combined
</VirtualHost>

# Opción B (solo estáticos, sin PM2 web): descomentar y comentar ProxyPass / arriba
# DocumentRoot /home/jsoto/producto-builder/frontend/dist
# <Directory /home/jsoto/producto-builder/frontend/dist>
#     Options -Indexes +FollowSymLinks
#     AllowOverride None
#     Require all granted
#     FallbackResource /index.html
# </Directory>
