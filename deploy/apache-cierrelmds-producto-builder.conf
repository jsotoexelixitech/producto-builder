# Fragmento para el VirtualHost SSL de cierrelmds.exelixitech.com
#
# PM2 srv001:
#   producto-builder-api  → 127.0.0.1:3015
#   producto-builder-web  → 127.0.0.1:5215  (SPA base /producto-builder/)
#
# Front build:
#   VITE_APP_BASE=/producto-builder/ VITE_API_PUBLIC_BASE=/producto-builder-api npm run build -w frontend

    # API product-builder
    ProxyPass        /producto-builder-api/  http://127.0.0.1:3015/producto-builder-api/
    ProxyPassReverse /producto-builder-api/  http://127.0.0.1:3015/producto-builder-api/

    # SPA catálogo — URL canónica: /producto-builder/ (con barra final)
    ProxyPass        /producto-builder/      http://127.0.0.1:5215/producto-builder/
    ProxyPassReverse /producto-builder/      http://127.0.0.1:5215/producto-builder/
