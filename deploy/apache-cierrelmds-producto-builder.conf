# Fragmento para el VirtualHost SSL de cierrelmds.exelixitech.com
# (junto a /ocr/, /admin/, /nexus-api/, etc.)
#
# PM2 en srv001:
#   producto-builder-api  → 127.0.0.1:3015  (NestJS, prefijo interno /api)
#   producto-builder-web  → 127.0.0.1:5215  (Vite preview, SPA base /producto-builder/)
#
# Front build:
#   VITE_APP_BASE=/producto-builder/ VITE_API_PUBLIC_BASE=/producto-builder-api npm run build -w frontend

    # API product-builder (prefijo dedicado — NO usar /api genérico)
    ProxyPass        /producto-builder-api/  http://127.0.0.1:3015/api/
    ProxyPassReverse /producto-builder-api/  http://127.0.0.1:3015/api/

    # SPA catálogo + flujo /emitir (Exélixi genérico)
    ProxyPass        /producto-builder/      http://127.0.0.1:5215/producto-builder/
    ProxyPassReverse /producto-builder/      http://127.0.0.1:5215/producto-builder/
